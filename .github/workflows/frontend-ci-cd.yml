name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  NODE_VERSION: "22"

jobs:
  build:
    name: Install, audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security scan (npm audit)
        # Fails the build on high or critical vulnerabilities.
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to S3 and CloudFront
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC federation with AWS
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve bucket and distribution
        id: target
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${S3_BUCKET}" ]; then
            S3_BUCKET=$(aws s3api list-buckets \
              --query "Buckets[?starts_with(Name, 'starttech-frontend-bucket')].Name | [0]" --output text)
          fi
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            CLOUDFRONT_DISTRIBUTION_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Origins.Items[?Id=='S3-Frontend' && starts_with(DomainName, '${S3_BUCKET}.')]].Id | [0]" --output text)
          fi
          for v in "$S3_BUCKET" "$CLOUDFRONT_DISTRIBUTION_ID"; do
            if [ -z "$v" ] || [ "$v" = "None" ]; then
              echo "::error::Could not resolve the S3 bucket or CloudFront distribution. Set the S3_BUCKET and CLOUDFRONT_DISTRIBUTION_ID repository variables."
              exit 1
            fi
          done
          echo "bucket=${S3_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${CLOUDFRONT_DISTRIBUTION_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload build files to S3 (aws s3 sync)
        run: |
          # Hashed assets: cache for a year.
          aws s3 sync dist/ "s3://${{ steps.target.outputs.bucket }}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          # index.html: always revalidate so new releases show up immediately.
          aws s3 cp dist/index.html "s3://${{ steps.target.outputs.bucket }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.target.outputs.distribution_id }}" \
            --paths "/*"

      - name: Summary
        run: |
          DOMAIN=$(aws cloudfront get-distribution --id "${{ steps.target.outputs.distribution_id }}" \
            --query Distribution.DomainName --output text)
          echo "### Frontend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${DOMAIN}" >> "$GITHUB_STEP_SUMMARY"
