name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "k8s/**"

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: starttech-backend-api
  EKS_CLUSTER_NAME: starttech-cluster
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        run: go test ./...

      - name: Build Docker image (tagged with git SHA)
        run: docker build -t "${ECR_REPOSITORY}:${IMAGE_TAG}" backend

      - name: Vulnerability scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "${ECR_REPOSITORY}:${IMAGE_TAG}"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag "${ECR_REPOSITORY}:${IMAGE_TAG}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Update k8s/deployment.yaml with the new image tag
        run: |
          sed -i -E "s|image: .*/${ECR_REPOSITORY}:.*|image: ${IMAGE}|" k8s/deployment.yaml

      - name: Connect to EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Create config and secrets
        run: |
          kubectl create namespace starttech --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n starttech create configmap backend-config \
            --from-literal=REDIS_HOST="${{ vars.REDIS_HOST }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n starttech create secret generic backend-secrets \
            --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: kubectl apply -f k8s/

      - name: Verify rollout
        run: kubectl rollout status deployment/backend-api -n starttech --timeout=300s
