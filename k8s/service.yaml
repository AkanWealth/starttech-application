# Exposes the backend on a fixed NodePort. The Terraform-managed ALB
# (origin "ALB-Backend" in CloudFront) registers the worker nodes on
# port 30080, so traffic flows:
#   CloudFront /api/* -> ALB :80 -> node :30080 -> pod :8080
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: starttech
  labels:
    app: backend-api
spec:
  type: NodePort
  selector:
    app: backend-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
