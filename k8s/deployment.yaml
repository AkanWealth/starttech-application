apiVersion: v1
kind: Namespace
metadata:
  name: starttech
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: starttech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: backend-api
          image: 283083851962.dkr.ecr.us-east-1.amazonaws.com/starttech-backend-api:d48757055c1f2afbe4e3a2d1e3fefe2b10028627
          ports:
            - containerPort: 8080
          env:
            - name: ENABLE_CACHE
              value: "true"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: REDIS_HOST
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: MONGO_URI
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
